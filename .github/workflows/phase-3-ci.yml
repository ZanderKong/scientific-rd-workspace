name: Phase 3 Scientific AI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-postgresql:
    name: Backend / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scientific
          POSTGRES_PASSWORD: scientific
          POSTGRES_DB: scientific_rd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scientific -d scientific_rd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd
      TEST_DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync --locked
      - name: Migrate blank PostgreSQL database
        run: uv run alembic upgrade head
      - name: Verify migration/model parity
        run: uv run alembic check
      - name: Verify populated Phase 2 upgrade to Phase 3 head
        env:
          PHASE2_DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd_phase2
        run: |
          PGPASSWORD=scientific createdb -h localhost -U scientific scientific_rd_phase2
          DATABASE_URL="$PHASE2_DATABASE_URL" uv run alembic upgrade 0004_literature_evidence
          DATABASE_URL="$PHASE2_DATABASE_URL" uv run python -m app.seed
          DATABASE_URL="$PHASE2_DATABASE_URL" uv run python - <<'PY' > /tmp/phase2-hashes-before.txt
          import hashlib
          import json

          from app.db import SessionLocal
          from app.models import EvidenceRecord, Experiment, ExperimentRevision, LiteratureRecord, Measurement, MeasurementImport

          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, default=str, separators=(",", ":")).encode()).hexdigest()

          with SessionLocal() as db:
              rows = {
                  "experiments": [(str(item.id), digest({"structured_data": item.structured_data, "note_document": item.note_document, "template_id": str(item.template_id), "template_version": item.template_version})) for item in db.query(Experiment).order_by(Experiment.id).all()],
                  "revisions": [(str(item.id), digest(item.snapshot_json)) for item in db.query(ExperimentRevision).order_by(ExperimentRevision.id).all()],
                  "measurements": [(str(item.id), digest({"summary_json": item.summary_json, "points_sha256": item.points_sha256})) for item in db.query(Measurement).order_by(Measurement.id).all()],
                  "imports": [(str(item.id), digest(item.mapping_json)) for item in db.query(MeasurementImport).order_by(MeasurementImport.id).all()],
                  "literature": [(str(item.id), digest({"title": item.title, "authors_json": item.authors_json, "publication_year": item.publication_year, "doi": item.doi, "url": item.url, "provider": item.provider, "external_id": item.external_id})) for item in db.query(LiteratureRecord).order_by(LiteratureRecord.id).all()],
                  "evidence": [(str(item.id), digest(item.source_snapshot_json)) for item in db.query(EvidenceRecord).order_by(EvidenceRecord.id).all()],
              }
          print(json.dumps(rows, sort_keys=True, separators=(",", ":")))
          PY
          DATABASE_URL="$PHASE2_DATABASE_URL" uv run alembic upgrade head
          DATABASE_URL="$PHASE2_DATABASE_URL" uv run alembic check
          DATABASE_URL="$PHASE2_DATABASE_URL" uv run python - <<'PY' > /tmp/phase2-hashes-after.txt
          import hashlib
          import json

          from app.db import SessionLocal
          from app.models import EvidenceRecord, Experiment, ExperimentRevision, LiteratureRecord, Measurement, MeasurementImport

          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, default=str, separators=(",", ":")).encode()).hexdigest()

          with SessionLocal() as db:
              rows = {
                  "experiments": [(str(item.id), digest({"structured_data": item.structured_data, "note_document": item.note_document, "template_id": str(item.template_id), "template_version": item.template_version})) for item in db.query(Experiment).order_by(Experiment.id).all()],
                  "revisions": [(str(item.id), digest(item.snapshot_json)) for item in db.query(ExperimentRevision).order_by(ExperimentRevision.id).all()],
                  "measurements": [(str(item.id), digest({"summary_json": item.summary_json, "points_sha256": item.points_sha256})) for item in db.query(Measurement).order_by(Measurement.id).all()],
                  "imports": [(str(item.id), digest(item.mapping_json)) for item in db.query(MeasurementImport).order_by(MeasurementImport.id).all()],
                  "literature": [(str(item.id), digest({"title": item.title, "authors_json": item.authors_json, "publication_year": item.publication_year, "doi": item.doi, "url": item.url, "provider": item.provider, "external_id": item.external_id})) for item in db.query(LiteratureRecord).order_by(LiteratureRecord.id).all()],
                  "evidence": [(str(item.id), digest(item.source_snapshot_json)) for item in db.query(EvidenceRecord).order_by(EvidenceRecord.id).all()],
              }
          print(json.dumps(rows, sort_keys=True, separators=(",", ":")))
          PY
          cmp /tmp/phase2-hashes-before.txt /tmp/phase2-hashes-after.txt
      - name: Backend lint and format
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Verify idempotent Phase 3 demo seed
        run: |
          uv run python -m app.seed
          uv run python -m app.seed
          uv run python - <<'PY'
          from sqlalchemy import func, select
          from app.db import SessionLocal
          from app.models import EvidenceRecord, EvaluationCase, LiteratureRecord, Measurement, MeasurementImport
          with SessionLocal() as db:
              assert db.scalar(select(func.count()).select_from(Measurement)) == 3
              assert db.scalar(select(func.count()).select_from(MeasurementImport)) == 3
              assert db.scalar(select(func.count()).select_from(LiteratureRecord)) == 1
              assert db.scalar(select(func.count()).select_from(EvidenceRecord)) == 1
              assert db.scalar(select(func.count()).select_from(EvaluationCase).where(EvaluationCase.case_type == "reference_case")) == 3
              assert db.scalar(select(func.count()).select_from(EvaluationCase).where(EvaluationCase.case_type == "bad_case")) == 3
          PY
      - name: Run backend tests against PostgreSQL
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build
