name: Scientific Workspace CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-postgresql:
    name: Backend / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scientific
          POSTGRES_PASSWORD: scientific
          POSTGRES_DB: scientific_rd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scientific -d scientific_rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd
      TEST_DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrate fresh PostgreSQL database
        run: uv run alembic upgrade head
      - name: Create isolated backend test database
        run: PGPASSWORD=scientific createdb -h localhost -U scientific scientific_rd_test
      - name: Verify migration metadata parity
        run: uv run alembic check
      - name: Reject removed v0.2 runtime references
        run: uv run python -m scripts.verify_no_legacy_runtime
      - name: Verify repeat-safe golden fixture
        run: uv run python -m scripts.verify_seed
      - name: Run canonical graph benchmark smoke
        run: uv run python -m scripts.benchmark_object_graph
      - name: Backend quality and PostgreSQL tests
        run: |
          uv run ruff check app tests scripts alembic/versions
          uv run ruff format --check app tests scripts alembic/versions
          uv run pytest -q

  migration-legacy:
    name: Migration / Legacy 0006 → v0.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scientific
          POSTGRES_PASSWORD: scientific
          POSTGRES_DB: scientific_rd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scientific -d scientific_rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Create legacy 0006 database and fixture
        run: |
          uv run alembic upgrade 0006_agent_changes
          uv run python -m scripts.prepare_legacy_v02_fixture
      - name: Upgrade legacy data to v0.3 and verify cutover
        run: |
          uv run alembic upgrade head
          uv run python -m scripts.verify_legacy_cutover
          uv run alembic check

  frontend-quality:
    name: Frontend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:strict
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  mcp-contract:
    name: MCP / Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scientific
          POSTGRES_PASSWORD: scientific
          POSTGRES_DB: scientific_rd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scientific -d scientific_rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd
      TEST_DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: PGPASSWORD=scientific createdb -h localhost -U scientific scientific_rd_test
      - name: Verify stdio and streamable HTTP with MCP ClientSession
        run: uv run pytest -q tests/test_mcp_contract.py

  browser-first-run:
    name: Browser / First Run
    needs: [backend-postgresql, migration-legacy, frontend-quality, mcp-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scientific
          POSTGRES_PASSWORD: scientific
          POSTGRES_DB: scientific_rd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scientific -d scientific_rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd
      API_URL: http://127.0.0.1:8000/api/v1
      WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and migrate API without synthetic seed data
        working-directory: api
        run: |
          uv sync --locked
          uv run alembic upgrade head
      - name: Start API
        working-directory: api
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api-first-run.log" 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$API_URL/health" && exit 0; sleep 1; done
          exit 1
      - name: Build and start frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > "$GITHUB_WORKSPACE/web-first-run.log" 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$WEB_URL/dashboard/samples" >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Install Playwright Chromium
        working-directory: web
        run: npm run e2e:install
      - name: Run fresh browser acceptance
        working-directory: web
        run: npm run e2e -- e2e/first-run.spec.ts
      - name: Upload first-run browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-first-run-evidence
          path: |
            web/output/playwright
            api-first-run.log
            web-first-run.log
          if-no-files-found: warn

  browser-golden-scientific-workflow:
    name: Browser / Golden Scientific Workflow
    needs: [backend-postgresql, migration-legacy, frontend-quality, mcp-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scientific
          POSTGRES_PASSWORD: scientific
          POSTGRES_DB: scientific_rd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scientific -d scientific_rd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scientific:scientific@localhost:5432/scientific_rd
      API_URL: http://127.0.0.1:8000/api/v1
      WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, migrate, and verify named golden fixture
        working-directory: api
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m scripts.verify_seed
      - name: Start API
        working-directory: api
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api-golden.log" 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$API_URL/health" && exit 0; sleep 1; done
          exit 1
      - name: Build and start frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > "$GITHUB_WORKSPACE/web-golden.log" 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$WEB_URL/dashboard/samples" >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Install Playwright Chromium
        working-directory: web
        run: npm run e2e:install
      - name: Run complete scientific browser acceptance
        working-directory: web
        run: >-
          npm run e2e -- e2e/sample-composer.spec.ts
          e2e/composer-quick-create.spec.ts
          e2e/template-maintenance.spec.ts
          e2e/golden-scientific-workflow.spec.ts
          e2e/data-composer.spec.ts
          e2e/sample-table.spec.ts
          e2e/sample-batch-ui.spec.ts
          e2e/workflow-v15.spec.ts
          e2e/sample-save-race.spec.ts
      - name: Upload golden browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-golden-scientific-workflow-evidence
          path: |
            web/output/playwright
            api-golden.log
            web-golden.log
          if-no-files-found: warn
