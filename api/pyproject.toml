[project]
name = "scientific-rd-workspace-api"
version = "0.1.0"
description = "FastAPI backend for the Scientific R&D Workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi[standard]>=0.115,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3"
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1"
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses Depends/File defaults.
